<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Fiche membre — MAJA 13</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="maja-theme.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif}
    header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,72px);border-bottom:1px solid var(--maja-line);background:rgba(7,7,8,.72);backdrop-filter:blur(18px)}
    header a{color:var(--maja-ivory);text-decoration:none}.wordmark{font-weight:800;letter-spacing:.22em}.wordmark span{color:var(--maja-accent-bright)}
    main{width:min(940px,calc(100% - 40px));margin:0 auto;padding:clamp(48px,8vw,96px) 0}
    .eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--maja-accent-bright);margin-bottom:22px}
    .identity{display:grid;grid-template-columns:140px 1fr;gap:34px;align-items:center}
    .avatar{width:140px;height:140px;border-radius:34px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,rgba(211,75,94,.2),rgba(255,255,255,.03));border:1px solid var(--maja-line-hot);font:900 44px/1 'Playfair Display',serif;color:var(--maja-ivory);box-shadow:0 30px 80px rgba(0,0,0,.35)}
    .avatar img{width:100%;height:100%;object-fit:cover}.identity h1{font:900 clamp(42px,8vw,78px)/.95 'Playfair Display',serif;letter-spacing:-.045em;margin:0 0 14px}
    .rank{display:inline-flex;padding:8px 13px;border:1px solid var(--maja-line-hot);border-radius:999px;color:var(--maja-accent-bright);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:48px}.card{padding:24px;border-radius:18px}.card h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--maja-muted);margin:0 0 12px}.card p{line-height:1.7;margin:0;color:var(--maja-ivory)}
    .empty{color:var(--maja-muted)!important}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}.btn{padding:12px 18px;border:1px solid var(--maja-line);border-radius:10px;color:var(--maja-ivory);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.btn.primary{background:linear-gradient(135deg,var(--maja-accent-bright),var(--maja-accent));border-color:transparent}
    @media(max-width:720px){.identity{grid-template-columns:1fr}.avatar{width:112px;height:112px;border-radius:28px}.grid{grid-template-columns:1fr}.identity h1{font-size:50px}}
  </style>
</head>
<body>
  <header><a class="wordmark" href="index.html">MAJA <span>13</span></a><a href="index.html#membres">← Membres</a></header>
  <main>
    <div class="eyebrow">M13 MEMBER FILE · ACCÈS PUBLIC</div>
    <section class="identity">
      <div class="avatar" id="avatar">M13</div>
      <div><h1 id="name">Membre</h1><div class="rank" id="rank">MAJA 13</div></div>
    </section>
    <section class="grid">
      <article class="card"><h2>Spécialité</h2><p id="speciality" class="empty">À renseigner dans le profil.</p></article>
      <article class="card"><h2>Citation</h2><p id="quote" class="empty">À renseigner dans le profil.</p></article>
      <article class="card"><h2>Biographie RP</h2><p id="bio" class="empty">À renseigner dans le profil.</p></article>
    </section>
    <div class="actions"><a class="btn primary" href="espace-membre.html">Ouvrir le M13 Hub</a><a class="btn" href="index.html#membres">Retour à l’organigramme</a></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    (function () {
      const requested = new URLSearchParams(location.search).get('nom') || '';
      const member = (window.MAJA_MEMBRES || []).find(item => item.nom === requested) || (window.MAJA_MEMBRES || [])[0];
      if (!member) return;
      const initials = member.nom.split(/\s+/).map(part => part[0]).slice(0, 2).join('').toUpperCase();
      document.title = member.nom + ' — MAJA 13';
      document.getElementById('name').textContent = member.nom;
      document.getElementById('rank').textContent = member.rang;
      document.getElementById('avatar').textContent = initials;
      if (!window.supabase || !window.SUPABASE_URL || !window.SUPABASE_KEY) return;
      const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
      client.from('profils').select('nom,photo_url,specialite,citation,bio').eq('nom', member.nom).maybeSingle().then(({ data }) => {
        if (!data) return;
        if (data.photo_url) document.getElementById('avatar').innerHTML = '<img src="' + encodeURI(data.photo_url) + '" alt="">';
        [['speciality','specialite'],['quote','citation'],['bio','bio']].forEach(([id,key]) => {
          if (data[key]) { const el = document.getElementById(id); el.textContent = data[key]; el.classList.remove('empty'); }
        });
      });
    })();
  </script>
</body>
</html>
