# /opt/maja13/server/deploy/docker-compose.yml
# Lancer depuis /opt/maja13 :  sudo docker compose -f server/deploy/docker-compose.yml up -d --build
name: maja13
services:
  # noms explicites : le réseau vps_default est partagé avec Dynasty 8, dont le service s'appelle déjà "app"
  maja13-app:
    container_name: maja13-app-1
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: ../.env          # DATABASE_URL est déduite de POSTGRES_PASSWORD par l'app
    volumes:
      - maja13-uploads:/app/uploads   # photos de la galerie
    depends_on:
      maja13-db:
        condition: service_healthy
    networks:
      - default
      - caddy            # réseau du Caddy de Dynasty 8, pour le reverse proxy
      - botnet           # réseau du bot Discord Maja 13, pour lire sa base
  maja13-db:
    container_name: maja13-db-1
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ../.env          # fournit POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: maja13
      POSTGRES_USER: maja13
    volumes:
      - maja13-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maja13 -d maja13"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  maja13-db:
  maja13-uploads:
networks:
  caddy:
    external: true
    name: vps_default     # réseau du compose Dynasty 8 (là où vit vps-caddy-1)
  botnet:
    external: true
    name: maja13-bot_default   # réseau du compose du bot (/opt/maja13-bot)
