name: Rappel push
on:
  schedule:
    - cron: '0 16 * * 6'   # samedi 18h (heure FR, ete)
  workflow_dispatch:
    inputs:
      titre:
        description: 'Titre'
        default: "🎯 Derniere ligne droite"
      message:
        description: 'Message'
        default: "Le quota tombe dimanche 19h — verifie ou tu en es sur l'appli."
jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node outils/envoyer-push.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          TITRE: ${{ inputs.titre || '🎯 Derniere ligne droite' }}
          MESSAGE: ${{ inputs.message || 'Le quota tombe dimanche 19h.' }}
